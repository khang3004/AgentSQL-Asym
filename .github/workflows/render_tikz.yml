name: Render TikZ Flowchart

on:
  push:
    branches:
      - main
    # Only trigger the workflow if the specific TikZ source file is modified
    paths:
      - "latex_playground/tikz_artifacts/agentsql_workflow.tex"

# Explicitly grant write permissions so the GITHUB_TOKEN can push changes
permissions:
  contents: write

jobs:
  build_and_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX to PDF
        # Use xu-cheng/latex-action@v3 as requested for reliable LaTeX compilation
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: latex_playground/tikz_artifacts
          root_file: agentsql_workflow.tex

      - name: Install PDF Render Tools & Convert to PNG
        working-directory: latex_playground/tikz_artifacts
        run: |
          # 1. Install poppler-utils (lightweight and safer than ImageMagick)
          sudo apt-get update
          sudo apt-get install -y poppler-utils

          # 2. Convert PDF to PNG using pdftocairo
          # -png: Output as PNG format (default background is white)
          # -r 300: Set resolution to 300 DPI (ensures high quality for papers/theses)
          # -singlefile: Output a static filename (no page number appended)
          # Syntax: pdftocairo [options] <input.pdf> <output_prefix>
          pdftocairo -png -r 300 -singlefile agentsql_workflow.pdf agentsql_workflow

      - name: Auto-commit and Push PNG
        run: |
          # Configure Git credentials for the default GitHub Actions bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the newly generated PNG file
          git add latex_playground/tikz_artifacts/agentsql_workflow.png

          # Check if there are uncommitted changes (i.e. if the PNG actually changed)
          # If it has changed, commit it with the "[skip ci]" flag to prevent infinite loops,
          # then push the changes back to the repository using the default GITHUB_TOKEN.
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(docs): auto-render TikZ flowchart to PNG [skip ci]"
            git push
          else
            echo "No visual changes in the PNG detected. Skipping commit."
          fi
