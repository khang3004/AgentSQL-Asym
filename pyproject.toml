[project]
name = "bird-mini-dev"
version = "0.1.0"
description = "BIRD Mini-Dev Evaluation and Text-to-SQL Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.34.0",
    "func-timeout>=4.3.5",
    "numpy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pymysql>=1.1.1",
    "tqdm>=4.66.4",
    "pydantic>=2.7.4",
    "python-dotenv",
    "google-genai",
    "groq",
    "gdown",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
